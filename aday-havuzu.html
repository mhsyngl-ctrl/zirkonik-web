  <style>

    --color-background: #0E1013;
    --color-foreground: #F2F4F7;
    --color-primary: #3D7CDC;
    --color-primary-foreground: #FFFFFF;
    --color-secondary: #232732;
    --color-secondary-foreground: #C6CBD6;
    --color-accent: #F0A03C;
    --color-accent-foreground: #FFFFFF;
    --color-muted: #1B1E24;
    --color-muted-foreground: #98A0AD;
    --color-card: #15171C;
    --color-card-foreground: #F2F4F7;
    --color-border: #262A32;
    --color-input: #1B1E24;
    --color-destructive: #EF5350;

  .zk-stage-tabs { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .zk-stage-tabs::-webkit-scrollbar { display: none; }
  .zk-stage-tab { flex: 0 0 auto; padding: 8px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid var(--color-border); background: var(--color-card); color: var(--color-muted-foreground); }

  <script>
    (function() {
      var els = document.querySelectorAll('iconify-icon');
      for (var i = 0; i < els.length; i++) (function(el) {
        var tries = 0;
        (function check() {
          var s = el.status;
          if (s === 'failed') el.setAttribute('icon', 'lucide:circle');
          else if (s !== 'rendered' && tries++ < 40) setTimeout(check, 250);
        })();
      })(els[i]);
    })();
  </script>

  <div id="zk-toast" style="position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;background:#17242C;color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;z-index:9999;max-width:86%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18);"></div>
  <script>
    function zkToast(msg){
      var el = document.getElementById('zk-toast');
      if(!el) return;
      el.textContent = msg;
      el.style.opacity = '1';
      el.style.transform = 'translate(-50%,0)';
      clearTimeout(window.__zkToastTimer);
      window.__zkToastTimer = setTimeout(function(){
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%,16px)';
      }, 2200);
    }
  </script>

  <script>
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    var STAGES = [
      { key: '', label: 'Süreçte' }, // varsayılan: aktif hariç hepsi
      { key: 'aday_havuzu', label: 'Doktor havuzu' },
      { key: 'ilk_temas', label: 'İlk temas' },
      { key: 'tanitim_yapildi', label: 'Tanıtım yapıldı' },
      { key: 'deneme_vakasi', label: 'Deneme vakası' },
      { key: 'uyuyan', label: 'Uyuyan' },
      { key: 'kayip', label: 'Kayıp' },
      { key: 'beklemede', label: 'Beklemede' }
    ];
    var STAGE_LABELS = { aday_havuzu: 'Doktor havuzu', ilk_temas: 'İlk temas', tanitim_yapildi: 'Tanıtım yapıldı', deneme_vakasi: 'Deneme vakası', aktif: 'Aktif doktor', uyuyan: 'Uyuyan doktor', kayip: 'Kayıp', beklemede: 'Beklemede' };
    var curStage = '';
    var regions = [];
    var reps = [];
    var currentList = [];
    var detailDoctor = null;
    var pendingTouchType = null;

    document.getElementById('stage-tabs').innerHTML = STAGES.map(function (s) {
      return '<button type="button" class="zk-stage-tab' + (s.key === curStage ? ' on' : '') + '" data-stage="' + s.key + '" onclick="zkSetStage(\'' + s.key + '\')">' + s.label + '</button>';
    }).join('');

    function zkSetStage(stage) {
      curStage = stage;
      document.querySelectorAll('.zk-stage-tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-stage') === stage); });
      loadList();
    }

    function loadList() {
      var onb = window.ZKHiz ? ZKHiz.cachePeek('aday_' + (curStage || 'surecte')) : null;
      if (onb) { currentList = onb; renderList(); }
      ZirkonikData.listPipelineDoctors(curStage || null).then(function (r) {
        if (r.error) { zkToast('Yüklenemedi: ' + r.error.message); return; }
        currentList = r.data || [];
        if (window.ZKHiz) ZKHiz.cachePut('aday_' + (curStage || 'surecte'), currentList);
        renderList();
      });
    }

    function renderList() {
      var el = document.getElementById('prospect-list');
      if (!currentList.length) { el.innerHTML = '<p class="mt-8 text-center text-xs text-muted-foreground">Bu aşamada kayıt yok.</p>'; return; }
      el.innerHTML = currentList.map(function (d) {
        var prioCls = d.priority === 'yuksek' ? 'zk-prio-yuksek' : d.priority === 'dusuk' ? 'zk-prio-dusuk' : 'zk-prio-orta';
        var overdue = d.next_action_at && new Date(d.next_action_at) <= new Date();
        return '<button type="button" onclick="zkOpenDetail(\'' + d.id + '\')" class="block w-full rounded-theme border border-border bg-card p-4 text-left">' +
          '<div class="flex items-start justify-between gap-2">' +
          '<div class="min-w-0"><p class="truncate font-heading text-sm font-bold">Dr. ' + escapeHtml(d.full_name) + '</p>' +
          '<p class="mt-0.5 truncate text-xs text-muted-foreground">' + escapeHtml(d.clinic_name || '—') + (d.region ? ' · ' + escapeHtml(d.region.name) : '') + '</p></div>' +
          '<span class="shrink-0 rounded-full ' + prioCls + ' px-2 py-1 text-[10px] font-bold">' + (d.priority === 'yuksek' ? 'Yüksek' : d.priority === 'dusuk' ? 'Düşük' : 'Orta') + '</span></div>' +
          '<div class="mt-2 flex flex-wrap items-center gap-1.5">' +
          '<span class="rounded-full bg-secondary px-2 py-1 text-[10px] font-bold text-secondary-foreground">' + STAGE_LABELS[d.pipeline_stage] + '</span>' +
          (d.temsilci ? '<span class="rounded-full bg-muted px-2 py-1 text-[10px] text-muted-foreground">' + escapeHtml(d.temsilci.full_name) + '</span>' : '') +
          (d.next_action_at ? '<span class="rounded-full ' + (overdue ? 'bg-destructive/10 text-destructive' : 'bg-muted text-muted-foreground') + ' px-2 py-1 text-[10px] font-bold">' + (overdue ? 'Gecikti: ' : '') + new Date(d.next_action_at).toLocaleDateString('tr-TR') + '</span>' : '') +
          '</div></button>';
      }).join('');
      if (window.zkFlow) window.zkFlow.stagger(el);
    }

    // ---- Bölgeler ----
    var SIDE_LABELS = { avrupa: 'Avrupa Yakası', asya: 'Asya Yakası' };
    // Bölgeler artık serbest yazım değil — kayıtlı ilçe listesinden seçilir (24 Eylül
    // 2026, sahibinin isteği). Yaka (avrupa/asya) grup başlığı olarak gösterilir;
    // yakasız (elle eklenmiş özel) bölgeler başlıksız, en üstte kalır.
    function zkRegionOptionsHtml(placeholder) {
      var html = '<option value="">' + placeholder + '</option>';
      var gruplar = {}, sirasiz = [];
      regions.forEach(function (r) { if (r.side) { (gruplar[r.side] = gruplar[r.side] || []).push(r); } else { sirasiz.push(r); } });
      sirasiz.forEach(function (r) { html += '<option value="' + r.id + '">' + escapeHtml(r.name) + '</option>'; });
      ['avrupa', 'asya'].forEach(function (side) {
        if (!gruplar[side]) return;
        html += '<optgroup label="' + SIDE_LABELS[side] + '">' + gruplar[side].map(function (r) {
          return '<option value="' + r.id + '">' + escapeHtml(r.name) + '</option>';
        }).join('') + '</optgroup>';
      });
      return html;
    }
    function loadRegionsAndReps() {
      return Promise.all([ZirkonikData.listRegions(), ZirkonikData.listStaff()]).then(function (res) {
        regions = (res[0] && res[0].data) || [];
        reps = ((res[1] && res[1].data) || []).filter(function (u) { return u.role !== 'doktor'; });
        document.getElementById('np-region').innerHTML = zkRegionOptionsHtml('Bölge seçin');
        document.getElementById('dt-region').innerHTML = zkRegionOptionsHtml('—');
        document.getElementById('dt-rep').innerHTML = '<option value="">—</option>' + reps.map(function (u) { return '<option value="' + u.id + '">' + escapeHtml(u.full_name) + '</option>'; }).join('');
      });
    }
    function zkOpenRegions() {
      document.getElementById('regions-sheet').classList.remove('hidden');
      renderRegionsList();
    }
    function zkCloseRegions() { document.getElementById('regions-sheet').classList.add('hidden'); }
    function regionRow(r) {
      return '<div class="flex items-center justify-between rounded-theme border border-border bg-background p-3">' +
        '<div><p class="text-sm font-bold">' + escapeHtml(r.name) + '</p>' +
        '<p class="mt-0.5 text-[11px] text-muted-foreground">' + (r.temsilci ? escapeHtml(r.temsilci.full_name) : 'Temsilci atanmadı') + '</p></div>' +
        '<select onchange="zkAssignRegionRep(\'' + r.id + '\', this.value)" class="h-9 rounded-lg border border-border bg-input px-2 text-[11px]">' +
        '<option value="">Temsilci ata</option>' + reps.map(function (u) { return '<option value="' + u.id + '"' + (r.assigned_rep_id === u.id ? ' selected' : '') + '>' + escapeHtml(u.full_name) + '</option>'; }).join('') +
        '</select></div>';
    }
    function renderRegionsList() {
      var el = document.getElementById('regions-list');
      if (!regions.length) { el.innerHTML = '<p class="text-xs text-muted-foreground">Henüz bölge yok.</p>'; return; }
      var gruplar = {}, sirasiz = [];
      regions.forEach(function (r) { if (r.side) { (gruplar[r.side] = gruplar[r.side] || []).push(r); } else { sirasiz.push(r); } });
      var html = sirasiz.map(regionRow).join('');
      ['avrupa', 'asya'].forEach(function (side) {
        if (!gruplar[side]) return;
        html += '<p class="mt-3 text-[10px] font-bold uppercase tracking-wide text-muted-foreground">' + SIDE_LABELS[side] + '</p>' +
          '<div class="mt-1.5 space-y-2">' + gruplar[side].map(regionRow).join('') + '</div>';
      });
      el.innerHTML = html;
    }
    function zkAssignRegionRep(regionId, repId) {
      ZirkonikData.updateRegion(regionId, { assigned_rep_id: repId || null }).then(function (res) {
        if (res.error) { zkToast('Olmadı: ' + res.error.message); return; }
        loadRegionsAndReps().then(renderRegionsList);
      });
    }
    function zkAddRegion() {
      var errEl = document.getElementById('nreg-error');
      errEl.classList.add('hidden');
      var name = document.getElementById('nreg-name').value.trim();
      if (!name) { errEl.textContent = 'Bölge adı zorunludur.'; errEl.classList.remove('hidden'); return; }
      ZirkonikData.createRegion(name).then(function (res) {
        if (res.error) { errEl.textContent = 'Eklenemedi: ' + res.error.message; errEl.classList.remove('hidden'); return; }
        document.getElementById('nreg-name').value = '';
        zkToast('Bölge eklendi.');
        loadRegionsAndReps().then(renderRegionsList);
      });
    }

    // ---- Aday ekle ----
    var newProspectPrio = 'orta';
    function zkSetPrio(p) {
      newProspectPrio = p;
      ['yuksek', 'orta', 'dusuk'].forEach(function (k) {
        var b = document.getElementById('np-prio-' + k);
        b.className = 'h-11 rounded-theme border text-xs font-bold ' + (k === p ? 'border-primary bg-primary/10 text-primary' : 'border-border');
      });
    }
    zkSetPrio('orta');
    function zkOpenAddProspect() { document.getElementById('add-prospect-sheet').classList.remove('hidden'); }
    function zkCloseAddProspect() { document.getElementById('add-prospect-sheet').classList.add('hidden'); }
    function zkSubmitAddProspect() {
      var errEl = document.getElementById('np-error');
      errEl.classList.add('hidden');
      var name = document.getElementById('np-name').value.trim();
      if (!name) { errEl.textContent = 'Doktor adı zorunludur.'; errEl.classList.remove('hidden'); return; }
      ZirkonikAuth.me().then(function (me) {
        return ZirkonikData.createProspect({
          organization_id: me.organization_id,
          full_name: name,
          clinic_name: document.getElementById('np-clinic').value.trim() || null,
          address: document.getElementById('np-address').value.trim() || null,
          phone: document.getElementById('np-phone').value.trim() || null,
          region_id: document.getElementById('np-region').value || null,
          source: document.getElementById('np-source').value || null,
          priority: newProspectPrio,
          assigned_rep_id: (me.role === 'personel') ? me.id : null
        });
      }).then(function (res) {
        if (res.error) throw res.error;
        zkCloseAddProspect();
        ['np-name', 'np-clinic', 'np-address', 'np-phone'].forEach(function (id) { document.getElementById(id).value = ''; });
        zkSetPrio('orta');
        zkToast('Aday eklendi.');
        zkSetStage('aday_havuzu');
      }).catch(function (err) {
        errEl.textContent = 'Eklenemedi: ' + err.message;
        errEl.classList.remove('hidden');
      });
    }

    // ---- Detay ----
    function zkOpenDetail(id) {
      var d = null;
      for (var i = 0; i < currentList.length; i++) { if (currentList[i].id === id) { d = currentList[i]; break; } }
      if (!d) return;
      detailDoctor = d;
      document.getElementById('dt-name').textContent = 'Dr. ' + d.full_name;
      document.getElementById('dt-clinic').textContent = d.clinic_name || '—';
      var activatorEl = document.getElementById('dt-activator');
      if (d.pipeline_stage === 'aktif' && d.activator) {
        activatorEl.textContent = d.activator.full_name + ' tarafından aktif edildi';
        activatorEl.classList.remove('hidden');
      } else { activatorEl.classList.add('hidden'); }
      document.getElementById('dt-stage').value = d.pipeline_stage;
      document.getElementById('dt-priority').value = d.priority || 'orta';
      document.getElementById('dt-lost-reason').value = d.lost_reason || 'fiyat';
      document.getElementById('dt-region').value = d.region_id || '';
      document.getElementById('dt-rep').value = d.assigned_rep_id || '';
      document.getElementById('dt-next-date').value = d.next_action_at ? d.next_action_at.slice(0, 10) : '';
      document.getElementById('dt-next-note').value = d.next_action_note || '';
      document.getElementById('dt-phone').value = d.phone || '';
      document.getElementById('dt-email').value = d.email || '';
      document.getElementById('dt-assistant-name').value = d.assistant_name || '';
      document.getElementById('dt-assistant-phone').value = d.assistant_phone || '';
      document.getElementById('dt-specialization').value = d.specialization || '';
      document.getElementById('dt-volume').value = d.estimated_case_volume || '';
      document.getElementById('dt-worktype').value = d.primary_work_type || '';
      document.getElementById('dt-scanner').checked = !!d.has_intraoral_scanner;
      document.getElementById('dt-scanner-brand').value = d.scanner_brand || '';
      document.getElementById('dt-priority-driver').value = d.priority_driver || '';
      document.getElementById('dt-error').classList.add('hidden');
      zkStageChanged();
      document.getElementById('dt-make-active-btn').classList.toggle('hidden', d.pipeline_stage === 'aktif');
      document.getElementById('detail-sheet').classList.remove('hidden');
      loadTouches(id);
    }
    // Otomatik 3-vaka kuralını beklemeden tek dokunuşla içeri alma. Kim aktif ettiği
    // (activated_by) kaydedilir — sahibinin isteği, 24 Eylül 2026.
    function zkMakeActive() {
      if (!detailDoctor) return;
      ZirkonikAuth.me().then(function (me) {
        return ZirkonikData.updateDoctorPipeline(detailDoctor.id, {
          pipeline_stage: 'aktif', stage_changed_at: new Date().toISOString(),
          next_action_at: null, next_action_note: null, activated_by: me ? me.id : null
        });
      }).then(function (res) {
        if (res.error) { zkToast('Olmadı: ' + res.error.message); return; }
        zkToast('Dr. ' + detailDoctor.full_name + ' aktif doktor oldu.');
        zkCloseDetail();
        loadList();
      });
    }
    function zkCloseDetail() { document.getElementById('detail-sheet').classList.add('hidden'); detailDoctor = null; }
    function zkStageChanged() {
      document.getElementById('dt-lost-wrap').classList.toggle('hidden', document.getElementById('dt-stage').value !== 'kayip');
    }
    function zkSaveDetail() {
      if (!detailDoctor) return;
      var errEl = document.getElementById('dt-error');
      errEl.classList.add('hidden');
      var stage = document.getElementById('dt-stage').value;
      var nextDate = document.getElementById('dt-next-date').value;
      var payload = {
        pipeline_stage: stage,
        priority: document.getElementById('dt-priority').value,
        lost_reason: stage === 'kayip' ? document.getElementById('dt-lost-reason').value : null,
        region_id: document.getElementById('dt-region').value || null,
        assigned_rep_id: document.getElementById('dt-rep').value || null,
        next_action_at: nextDate ? new Date(nextDate + 'T09:00:00').toISOString() : null,
        next_action_note: document.getElementById('dt-next-note').value.trim() || null,
        phone: document.getElementById('dt-phone').value.trim() || null,
        email: document.getElementById('dt-email').value.trim() || null,
        assistant_name: document.getElementById('dt-assistant-name').value.trim() || null,
        assistant_phone: document.getElementById('dt-assistant-phone').value.trim() || null,
        specialization: document.getElementById('dt-specialization').value || null,
        estimated_case_volume: document.getElementById('dt-volume').value || null,
        primary_work_type: document.getElementById('dt-worktype').value.trim() || null,
        has_intraoral_scanner: document.getElementById('dt-scanner').checked,
        scanner_brand: document.getElementById('dt-scanner-brand').value.trim() || null,
        priority_driver: document.getElementById('dt-priority-driver').value || null
      };
      if (stage !== detailDoctor.pipeline_stage) payload.stage_changed_at = new Date().toISOString();
      ZirkonikData.updateDoctorPipeline(detailDoctor.id, payload).then(function (res) {
        if (res.error) { errEl.textContent = 'Kaydedilemedi: ' + res.error.message; errEl.classList.remove('hidden'); return; }
        zkToast('Kaydedildi.');
        zkCloseDetail();
        loadList();
      });
    }

    // ---- Temas ----
    var TOUCH_LABELS = { ziyaret: 'Ziyaret', arama: 'Arama', whatsapp: 'WhatsApp', numune: 'Numune bırakıldı', sikayet: 'Şikayet', memnuniyet_aramasi: 'Memnuniyet araması', not: 'Not' };
    function loadTouches(doctorId) {
      ZirkonikData.listDoctorTouches(doctorId).then(function (r) {
        var el = document.getElementById('touch-list');
        var rows = r.data || [];
        el.innerHTML = rows.length ? rows.map(function (t) {
          return '<div class="rounded-theme border border-border bg-background p-3">' +
            '<div class="flex items-center justify-between"><span class="text-xs font-bold">' + (TOUCH_LABELS[t.type] || t.type) + '</span>' +
            '<span class="text-[10px] text-muted-foreground">' + new Date(t.created_at).toLocaleDateString('tr-TR') + '</span></div>' +
            (t.note ? '<p class="mt-1 text-xs text-muted-foreground">' + escapeHtml(t.note) + '</p>' : '') +
            (t.satisfaction_score ? '<p class="mt-1 text-xs font-bold text-primary">Memnuniyet: ' + t.satisfaction_score + '/5</p>' : '') +
            (t.yazan ? '<p class="mt-1 text-[10px] text-muted-foreground">' + escapeHtml(t.yazan.full_name) + '</p>' : '') +
            '</div>';
        }).join('') : '<p class="text-xs text-muted-foreground">Henüz temas kaydı yok.</p>';
      });
    }
    function zkAddTouch(type) {
      pendingTouchType = type;
      document.getElementById('tn-title').textContent = TOUCH_LABELS[type];
      document.getElementById('tn-note').value = '';
      var satWrap = document.getElementById('tn-satisfaction-wrap');
      if (type === 'memnuniyet_aramasi') {
        satWrap.classList.remove('hidden');
        document.getElementById('tn-satisfaction').innerHTML = [1, 2, 3, 4, 5].map(function (n) {
          return '<button type="button" data-sat="' + n + '" onclick="zkSetSat(' + n + ')" class="h-10 rounded-lg border border-border text-sm font-bold">' + n + '</button>';
        }).join('');
        window.__tnSat = null;
      } else { satWrap.classList.add('hidden'); }
      document.getElementById('touch-note-sheet').classList.remove('hidden');
    }
    function zkSetSat(n) {
      window.__tnSat = n;
      document.querySelectorAll('#tn-satisfaction [data-sat]').forEach(function (b) {
        b.className = 'h-10 rounded-lg border text-sm font-bold ' + (Number(b.getAttribute('data-sat')) === n ? 'border-primary bg-primary/10 text-primary' : 'border-border');
      });
    }
    function zkCloseTouchNote() { document.getElementById('touch-note-sheet').classList.add('hidden'); }
    function zkSubmitTouchNote() {
      if (!detailDoctor || !pendingTouchType) return;
      var fields = { type: pendingTouchType, note: document.getElementById('tn-note').value.trim() || null };
      if (pendingTouchType === 'memnuniyet_aramasi' && window.__tnSat) fields.satisfaction_score = window.__tnSat;
      ZirkonikData.addDoctorTouch(detailDoctor.id, fields).then(function (res) {
        if (res.error) { zkToast('Olmadı: ' + res.error.message); return; }
        zkToast('Temas kaydedildi.');
        zkCloseTouchNote();
        loadTouches(detailDoctor.id);
      });
    }

    ZirkonikAuth.requireAuth().then(function (session) {
      if (!session) return;
      loadRegionsAndReps().then(loadList);
    });

    window.zkRefresh = function () {
      return Promise.all([Promise.resolve(loadList())]);
    };
  </script>
</body>
</html>
