<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Profil — Zirkonik</title>

  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/ipad.css">
  <link rel="stylesheet" href="css/zk-utils.css">
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@100;200;300;400;500;600;700;800;900&family=Source+Sans+3:wght@100;200;300;400;500;600;700;800;900&display=swap">

  <style>
  :root {
    --color-background: #F4F6F7;
    --color-foreground: #17242C;
    --color-primary: #123B4A;
    --color-primary-foreground: #FFFFFF;
    --color-secondary: #DCE8E8;
    --color-secondary-foreground: #17333D;
    --color-accent: #A14F22;
    --color-accent-foreground: #FFFFFF;
    --color-muted: #E7ECEE;
    --color-muted-foreground: #5C6B73;
    --color-card: #FFFFFF;
    --color-card-foreground: #17242C;
    --color-border: #CBD6D9;
    --color-input: #FFFFFF;
    --color-destructive: #B3262D;
    --color-destructive-foreground: #FFFFFF;
    --color-success: #176B5B;
    --color-success-foreground: #FFFFFF;
    --font-heading: 'Manrope', sans-serif;
    --font-body: 'Source Sans 3', sans-serif;
    --radius: 12px;
  }
  html { overflow-x: hidden; }
  body { font-family: var(--font-body); -webkit-font-smoothing: antialiased; margin: 0; padding: 0; overflow-x: hidden; overscroll-behavior-x: none; }
  </style>
</head>
<body class="bg-background text-foreground m-0 p-0">
  <div class="h-screen w-screen overflow-y-auto">
    <div class="min-h-screen w-full bg-background text-foreground font-body pb-16">
      <header class="border-b border-border bg-card px-5 pb-5 pt-12" style="padding-top:max(3rem,calc(env(safe-area-inset-top) + 12px));">
        <div class="flex items-center justify-between">
          <button onclick="location.href='retim.html'" class="flex h-10 w-10 items-center justify-center rounded-theme border border-border bg-card text-card-foreground">
            <iconify-icon icon="lucide:arrow-left" class="text-xl"></iconify-icon>
          </button>
          <p class="text-[10px] font-bold uppercase tracking-[0.16em] text-muted-foreground">Hesap</p>
          <div class="h-10 w-10"></div>
        </div>

        <div class="mt-6 flex items-center gap-3">
          <span id="pf-initial" class="flex h-14 w-14 items-center justify-center rounded-full bg-primary text-lg font-bold text-primary-foreground">—</span>
          <div>
            <p id="pf-name-label" class="font-heading text-lg font-bold">—</p>
            <p id="pf-role-label" class="text-xs text-muted-foreground">—</p>
          </div>
        </div>
      </header>

      <main class="px-5 pt-5">
        <section id="pf-work-stats" class="hidden rounded-theme border border-border bg-card p-4">
          <p class="text-[10px] font-bold uppercase tracking-[0.14em] text-muted-foreground">Yapılan işler</p>
          <div class="mt-3 grid grid-cols-2 gap-2.5">
            <div class="rounded-theme border border-border bg-background p-3">
              <p id="pf-job-count" class="font-heading text-xl font-bold tabular-nums">—</p>
              <p class="mt-0.5 text-[11px] text-muted-foreground">Tamamlanan iş</p>
            </div>
            <div class="rounded-theme border border-border bg-background p-3">
              <p id="pf-tooth-count" class="font-heading text-xl font-bold tabular-nums">—</p>
              <p class="mt-0.5 text-[11px] text-muted-foreground">Yapılan diş</p>
            </div>
          </div>
        </section>

        <section class="mt-5 rounded-theme border border-border bg-card p-4">
          <p class="text-[10px] font-bold uppercase tracking-[0.14em] text-muted-foreground">Profil bilgileri</p>
          <div class="mt-3 space-y-3">
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold text-card-foreground">Ad Soyad *</span>
              <input id="pf-name" type="text" class="h-12 w-full rounded-theme border border-border bg-input px-3.5 text-sm">
            </label>
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold text-card-foreground">Telefon</span>
              <input id="pf-phone" type="tel" class="h-12 w-full rounded-theme border border-border bg-input px-3.5 text-sm">
            </label>
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold text-card-foreground">E-posta</span>
              <input id="pf-email" type="email" disabled class="h-12 w-full rounded-theme border border-border bg-muted px-3.5 text-sm text-muted-foreground">
            </label>
          </div>
          <p id="pf-error" class="mt-2 hidden text-xs font-semibold text-destructive"></p>
          <button id="pf-save-btn" onclick="zkSaveProfile()" class="mt-4 flex h-12 w-full items-center justify-center rounded-theme bg-primary text-sm font-bold text-primary-foreground">Kaydet</button>
        </section>

        <section class="mt-5 rounded-theme border border-border bg-card p-4">
          <p class="text-[10px] font-bold uppercase tracking-[0.14em] text-muted-foreground">Hesap</p>
          <button onclick="ZirkonikAuth.signOut()" class="mt-3 flex h-12 w-full items-center justify-center gap-2 rounded-theme border border-border bg-background text-sm font-bold text-foreground">
            <iconify-icon icon="lucide:log-out" class="text-lg"></iconify-icon>
            Çıkış Yap
          </button>
          <button onclick="zkDeleteAccount()" class="mt-3 flex h-12 w-full items-center justify-center gap-2 rounded-theme bg-destructive/10 text-sm font-bold text-destructive">
            <iconify-icon icon="lucide:trash-2" class="text-lg"></iconify-icon>
            Hesabı Sil
          </button>
        </section>
      </main>
    </div>
  </div>
  <script>
    (function() {
      var els = document.querySelectorAll('iconify-icon');
      for (var i = 0; i < els.length; i++) (function(el) {
        var tries = 0;
        (function check() {
          var s = el.status;
          if (s === 'failed') el.setAttribute('icon', 'lucide:circle');
          else if (s !== 'rendered' && tries++ < 40) setTimeout(check, 250);
        })();
      })(els[i]);
    })();
  </script>

  <div id="zk-toast" style="position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;background:#17242C;color:#fff;font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;z-index:9999;max-width:86%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18);"></div>
  <script>
    function zkToast(msg){
      var el = document.getElementById('zk-toast');
      if(!el) return;
      el.textContent = msg;
      el.style.opacity = '1';
      el.style.transform = 'translate(-50%,0)';
      clearTimeout(window.__zkToastTimer);
      window.__zkToastTimer = setTimeout(function(){
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%,16px)';
      }, 2200);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    var ROLE_LABELS = { yonetici: 'Yönetici · Tam yetki', personel: 'Personel', doktor: 'Doktor' };

    ZirkonikAuth.requireAuth().then(function (session) {
      if (!session) return;
      ZirkonikAuth.me().then(function (me) {
        document.getElementById('pf-name-label').textContent = me.full_name;
        document.getElementById('pf-role-label').textContent = ROLE_LABELS[me.role] || me.role;
        document.getElementById('pf-initial').textContent = (me.full_name || '?').charAt(0).toUpperCase();
        document.getElementById('pf-name').value = me.full_name || '';
        document.getElementById('pf-phone').value = me.phone || '';
        document.getElementById('pf-email').value = session.user.email || '';

        if (me.role !== 'doktor') {
          document.getElementById('pf-work-stats').classList.remove('hidden');
          ZirkonikData.getStaffJobStats(me.id).then(function (r) {
            var stats = (r && r.data) || { jobCount: 0, teethCount: 0 };
            document.getElementById('pf-job-count').textContent = stats.jobCount;
            document.getElementById('pf-tooth-count').textContent = stats.teethCount;
          });
        }
      });
    });

    function zkSaveProfile() {
      var errEl = document.getElementById('pf-error');
      errEl.classList.add('hidden');
      var name = document.getElementById('pf-name').value.trim();
      if (!name) { errEl.textContent = 'Ad soyad zorunludur.'; errEl.classList.remove('hidden'); return; }
      var btn = document.getElementById('pf-save-btn');
      btn.disabled = true;
      ZirkonikAuth.me().then(function (me) {
        return ZirkonikAuth.client().from('app_users').update({
          full_name: name,
          phone: document.getElementById('pf-phone').value.trim() || null
        }).eq('id', me.id);
      }).then(function (res) {
        btn.disabled = false;
        if (res.error) throw res.error;
        ZirkonikAuth.clearMeCache();
        document.getElementById('pf-name-label').textContent = name;
        document.getElementById('pf-initial').textContent = name.charAt(0).toUpperCase();
        zkToast('Profil güncellendi.');
      }).catch(function (err) {
        btn.disabled = false;
        errEl.textContent = 'Kaydedilemedi: ' + err.message;
        errEl.classList.remove('hidden');
      });
    }

    function zkDeleteAccount() {
      var ok = confirm('Hesabınızı silmek üzeresiniz. Tek yöneticiyseniz laboratuvarınıza ait TÜM veriler (işler, doktorlar, stok, finans kayıtları) kalıcı olarak silinir. Bu işlem GERİ ALINAMAZ. Devam edilsin mi?');
      if (!ok) return;
      var typed = prompt('Onaylamak için "SİL" yazın:');
      if (typed !== 'SİL') { zkToast('İptal edildi.'); return; }
      ZirkonikData.deleteMyAccount().then(function (res) {
        if (res.error) { zkToast('Hesap silinemedi: ' + res.error.message); return; }
        alert('Hesabınız silindi.');
        window.location.href = 'giris.html';
      });
    }
  </script>

</body>
</html>
