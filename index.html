<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zirkonik</title>
  <style>body{background:#F4F6F7;margin:0;}</style>
</head>
<body>
  <p style="font-family:sans-serif;color:#5C6B73;padding:24px;">Yönlendiriliyor…</p>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    ZirkonikAuth.getSession().then(function (session) {
      if (!session) { window.location.href = 'giris.html'; return; }
      ZirkonikAuth.me().then(function (me) {
        window.location.href = (me && me.role === 'doktor') ? 'doktor-siparis.html' : 'retim.html';
      }).catch(function () { window.location.href = 'retim.html'; });
    });
  </script>
</body>
</html>
