<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://code.iconify.design; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cuujupeindodpsdjcivm.supabase.co wss://cuujupeindodpsdjcivm.supabase.co https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Zirkonik</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0E1013">
  <style>
    html,body{background:#0E1013;margin:0;height:100%;}
    /* Açılış ekranı: yazı yok; şeffaf Zirkonik diş logosu kendi ekseninde yavaşça dönüyor.
       Yönlendirme birkaç yüz ms sürer, boş ekran ya da yazı görünmesin. */
    .zk-acilis{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0E1013;perspective:800px;}
    .zk-acilis img{width:56px;height:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.55));animation:zk-don 2s cubic-bezier(.45,.05,.55,.95) infinite;}
    @keyframes zk-don{from{transform:rotateY(0deg);}to{transform:rotateY(360deg);}}
    @media (prefers-reduced-motion:reduce){.zk-acilis img{animation:none;}}
  </style>
</head>
<body>
  <div class="zk-acilis" role="status" aria-label="Zirkonik açılıyor"><img src="logo-dis.png" alt="Zirkonik"></div>
  <script src="vendor/supabase-js.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="js/net-guard.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    ZirkonikAuth.getSession().then(function (session) {
      if (!session) { window.location.href = 'giris.html'; return; }
      ZirkonikAuth.me().then(function (me) {
        window.location.href = (me && me.role === 'doktor') ? 'doktor-siparis.html' : 'retim.html';
      }).catch(function () { window.location.href = 'retim.html'; });
    });
  </script>
</body>
</html>
