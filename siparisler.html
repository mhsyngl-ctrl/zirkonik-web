  <link rel="stylesheet" href="css/ipad.css">

  <script src="js/zk-tema.js"></script>
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F5F7FA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
  :root {
    --color-background: #0E1013;
    --color-foreground: #F2F4F7;
    --color-primary: #3D7CDC;
    --color-primary-foreground: #FFFFFF;
    --color-secondary: #232732;
    --color-secondary-foreground: #C6CBD6;
    --color-accent: #F0A03C;
    --color-accent-foreground: #FFFFFF;
    --color-muted: #1B1E24;
    --color-muted-foreground: #98A0AD;
    --color-card: #15171C;
    --color-card-foreground: #F2F4F7;
    --color-border: #262A32;
    --color-input: #1B1E24;
    --color-destructive: #EF5350;
    --color-destructive-foreground: #FFFFFF;
    --color-success: #10B981;
    --color-success-foreground: #FFFFFF;
    --font-heading: 'Plus Jakarta Sans', sans-serif;
    --font-body: 'Inter', sans-serif;
    --radius: 12px;
  }
  html { overflow-x: hidden; }
  body { font-family: var(--font-body); -webkit-font-smoothing: antialiased; margin: 0; padding: 0; overflow-x: hidden; overscroll-behavior-x: none; }
  select { appearance: none; -webkit-appearance: none; background-image: none; }
  </style>
</head>
<body data-page="siparisler" class="bg-background text-foreground m-0 p-0">
  <div class="h-screen w-screen overflow-y-auto">
    <div class="min-h-screen w-full bg-background text-foreground font-body pb-16">
      <header class="border-b border-border bg-card px-5 pb-5 pt-12" style="padding-top:max(3rem,calc(env(safe-area-inset-top) + 12px));">
        <div class="flex items-center justify-between">
          <button onclick="location.href='retim.html'" class="flex h-10 w-10 items-center justify-center rounded-theme border border-border bg-card text-card-foreground">
            <iconify-icon icon="lucide:arrow-left" class="text-xl"></iconify-icon>
          </button>
          <p class="text-[10px] font-bold uppercase tracking-[0.16em] text-muted-foreground">Doktor siparişleri</p>
          <div class="h-10 w-10"></div>
        </div>
        <div class="mt-6">
          <h1 class="font-heading text-2xl font-bold tracking-tight">Siparişler</h1>
          <p class="mt-1 text-sm text-muted-foreground">Doktorların dijital çalışma formuyla gönderdiği talepler. Onaylanan sipariş otomatik işe dönüşür.</p>
        </div>

        <div class="mt-5 grid grid-cols-2 gap-2 rounded-theme border border-border bg-background p-1">
          <button id="tab-pending" onclick="zkSetTab('pending')" class="flex h-10 items-center justify-center rounded-lg bg-primary text-xs font-bold text-primary-foreground">Bekleyen</button>
          <button id="tab-done" onclick="zkSetTab('done')" class="flex h-10 items-center justify-center rounded-lg text-xs font-bold text-muted-foreground">Sonuçlanan</button>
        </div>
      </header>

      <main class="px-5 pt-5">
        <div id="orders-list" class="space-y-3"><p class="text-xs text-muted-foreground">Yükleniyor…</p></div>
      </main>
    </div>
  </div>

  <!-- Onay sheet: laboratuvar seç -->
  <div id="approve-sheet" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/40" onclick="zkCloseApprove()"></div>
    <div class="absolute bottom-0 left-0 w-full rounded-t-2xl bg-card p-5 pb-8">
      <h2 class="font-heading text-lg font-bold">Siparişi işe dönüştür</h2>
      <p id="ap-summary" class="mt-1 text-xs text-muted-foreground"></p>
      <div id="ap-price-box" class="mt-3 rounded-theme border border-border bg-muted/40 p-3">
        <p class="text-[10px] font-bold uppercase tracking-[0.14em] text-muted-foreground">Faturalanacak tutar</p>
        <p id="ap-price" class="mt-1 font-heading text-lg font-bold tabular-nums">—</p>
        <p id="ap-price-note" class="mt-0.5 text-[11px] text-muted-foreground"></p>
      </div>
      <label class="mt-4 block">
        <span class="mb-1.5 block text-xs font-bold">Sorumlu laboratuvar *</span>
        <select id="ap-lab" class="flex h-12 w-full items-center rounded-theme border border-border bg-input px-3.5 text-sm"></select>
      </label>
      <label class="mt-3 block">
        <span class="mb-1.5 block text-xs font-bold">Tahmini teslim tarihi</span>
        <input id="ap-delivery" type="date" class="h-12 w-full rounded-theme border border-border bg-input px-3.5 text-sm">
      </label>
      <p id="ap-error" class="mt-2 hidden text-xs font-semibold text-destructive"></p>
      <button id="ap-btn" onclick="zkApprove()" class="mt-4 flex h-12 w-full items-center justify-center rounded-theme bg-primary text-sm font-bold text-primary-foreground">Onayla ve İş Oluştur</button>
    </div>
  </div>

  <div id="zk-toast" style="position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;background:#17242C;color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;z-index:9999;max-width:86%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18);"></div>
  <script>
    function zkToast(msg){
      var el = document.getElementById('zk-toast');
      if(!el) return;
      el.textContent = msg;
      el.style.opacity = '1';
      el.style.transform = 'translate(-50%,0)';
      clearTimeout(window.__zkToastTimer);
      window.__zkToastTimer = setTimeout(function(){
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%,16px)';
      }, 2200);
    }
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
  </script>

  <script src="vendor/supabase-js.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="js/zk-guard.js"></script>
  <script src="js/zk-picker.js"></script>
  <script src="js/zk-ptr.js"></script>
  <script src="js/zk-yenile.js"></script>
  <script>
    var curTab = 'pending';
    var orders = [];
    var labs = [];
    var approveOrderId = null;
    // 2026-09-12: listede ve onay ekraninda liste fiyati gosteriliyordu, ama
    // fatura anlasmali fiyat (price_overrides) uzerinden kesiliyordu. Personel
    // onayladigi isin gercek tutarini hic gormuyordu.
    var priceOverrides = [];
    // Cok turlu siparislerde her kalemin kendi fiyat kalemi var; onay
    // oncesi tutari dogru gosterebilmek icin hepsi gerekiyor (siparis
    // iliskisi yalniz siparis duzeyindeki kalemi getiriyor).
    var priceItemsById = {};

    ZirkonikAuth.requireAuth().then(function (session) {
      if (!session) return;
      ZirkonikAuth.client().from('laboratories').select('id, name').order('name').then(function (r) {
        labs = r.data || [];
      });
      // Anlasmali fiyatlar ve fiyat kalemleri gelmeden liste ciziliyordu; tek
      // sefer, hata olsa bile liste yine yuklensin diye ayri yakalaniyor.
      Promise.all([
        ZirkonikData.listPriceOverrides().then(function (r) { return r.data || []; }, function () { return []; }),
        ZirkonikData.listPriceItems().then(function (r) { return r.data || []; }, function () { return []; })
      ]).then(function (res) {
        priceOverrides = res[0];
        res[1].forEach(function (p) { priceItemsById[p.id] = p; });
        loadOrders();
      });
    });

    // Siparisin bir laboratuvara gore gercek tutari. labId yoksa yalniz
    // doktor bazli/genel anlasmali fiyat uygulanir (laboratuvara ozel fiyat
    // ancak onay ekraninda laboratuvar secilince belli olur).
    function zkOrderPrice(o, labId) {
      // Siparisin kalemleri: cok turlu siparislerde orders.items dolu, eski
      // tek turlu siparislerde siparis duzeyindeki kalem tek basina.
      var kalemler = (o.items && o.items.length) ? o.items : (o.price_item_id ? [{
        price_item_id: o.price_item_id, unit_count: o.unit_count
      }] : []);
      if (!kalemler.length) return null;

      // Her kalem KENDI fiyat kaleminden fiyatlanir; anlasma kalem bazinda
      // farkli para biriminde olabilir, bu yuzden toplamlar para birimine
      // gore gruplaniyor.
      var gruplar = {};
      var satirlar = [];
      var anlasmali = false;
      var fiyatsiz = 0;
      kalemler.forEach(function (k) {
        var pi = priceItemsById[k.price_item_id] ||
          (k.price_item_id === o.price_item_id && o.price_list_items
            ? { id: o.price_item_id, unit_price: o.price_list_items.unit_price, currency: o.price_list_items.currency }
            : null);
        var adet = Math.max(1, Number(k.unit_count) || 1);
        if (!pi) { fiyatsiz++; return; }
        var unit = ZirkonikData.resolveUnitPrice(pi, priceOverrides, o.doctor_id, labId || null);
        if (unit == null) { fiyatsiz++; return; }
        var cur = ZirkonikData.resolveUnitCurrency(pi, priceOverrides, o.doctor_id, labId || null);
        gruplar[cur] = (gruplar[cur] || 0) + unit * adet;
        satirlar.push(ZirkonikMoney.format(unit, cur, 2) + ' × ' + adet + ' diş');
        if (pi.unit_price == null || unit !== Number(pi.unit_price)) anlasmali = true;
      });
      if (!Object.keys(gruplar).length) return null;
      return {
        totalText: ZirkonikMoney.formatTotals(gruplar, 2),
        detay: satirlar.join(' · '),
        isSpecial: anlasmali,
        fiyatsiz: fiyatsiz
      };
    }

    function zkSetTab(tab) {
      curTab = tab;
      var tp = document.getElementById('tab-pending');
      var td = document.getElementById('tab-done');
      tp.className = tab === 'pending'
        ? 'flex h-10 items-center justify-center rounded-lg bg-primary text-xs font-bold text-primary-foreground'
        : 'flex h-10 items-center justify-center rounded-lg text-xs font-bold text-muted-foreground';
      td.className = tab === 'done'
        ? 'flex h-10 items-center justify-center rounded-lg bg-primary text-xs font-bold text-primary-foreground'
        : 'flex h-10 items-center justify-center rounded-lg text-xs font-bold text-muted-foreground';
      loadOrders();
    }

    function wfSummary(o) {
      var wf = o.work_form || {};
      var bits = [];
      if (wf.renk) bits.push('Renk: ' + wf.renk);
      if (wf.gingiva) bits.push('Gingiva: ' + wf.gingiva);
      if (wf.dvo) bits.push('DVO: ' + wf.dvo);
      if (wf.prova_final) bits.push(wf.prova_final);
      if (wf.dis_boyu) bits.push('Boy: ' + wf.dis_boyu);
      if (wf.gulus) bits.push('Gülüş: ' + wf.gulus);
      if (wf.materyaller && wf.materyaller.length) bits.push('Materyal: ' + wf.materyaller.join(', '));
      if (wf.ozel_istek) bits.push('Not: ' + wf.ozel_istek);
      return bits;
    }

    var STATUS_BADGES = {
      pending: '<span class="rounded-full bg-accent/10 px-2 py-1 text-[10px] font-bold text-accent">Bekliyor</span>',
      approved: '<span class="rounded-full bg-success/10 px-2 py-1 text-[10px] font-bold text-success">Onaylandı</span>',
      rejected: '<span class="rounded-full bg-destructive/10 px-2 py-1 text-[10px] font-bold text-destructive">Reddedildi</span>'
    };

    function loadOrders() {
      ZirkonikData.listOrders().then(function (r) {
        if (r.error) { zkToast('Yüklenemedi: ' + r.error.message); return; }
        var all = r.data || [];
        orders = all.filter(function (o) {
          return curTab === 'pending' ? o.status === 'pending' : o.status !== 'pending';
        });
        var el = document.getElementById('orders-list');
        if (!orders.length) {
          el.innerHTML = '<p class="mt-8 text-center text-sm text-muted-foreground">' +
            (curTab === 'pending' ? 'Bekleyen sipariş yok.' : 'Sonuçlanmış sipariş yok.') + '</p>';
          return;
        }
        el.innerHTML = orders.map(function (o) {
          var doc = o.doctors || {};
          var d = new Date(o.created_at);
          var wfBits = wfSummary(o);
          var pr = zkOrderPrice(o, null);
          var priceInfo = pr
            ? pr.totalText + (pr.isSpecial ? ' (anlaşmalı)' : '')
            : 'Fiyat sorunuz';
          var actions = o.status === 'pending'
            ? '<div class="mt-3 grid grid-cols-2 gap-2">' +
              '<button onclick="zkOpenApprove(\'' + o.id + '\')" class="flex h-10 items-center justify-center gap-1.5 rounded-theme bg-primary text-xs font-bold text-primary-foreground"><iconify-icon icon="lucide:check" class="text-sm"></iconify-icon>Onayla</button>' +
              '<button onclick="zkReject(\'' + o.id + '\')" class="flex h-10 items-center justify-center gap-1.5 rounded-theme border border-border bg-background text-xs font-bold text-destructive">Reddet</button>' +
              '</div>'
            : (o.job_id ? '<button onclick="location.href=\'detay.html?id=' + o.job_id + '\'" class="mt-3 flex h-10 w-full items-center justify-center gap-1.5 rounded-theme border border-border bg-background text-xs font-bold text-primary">İşi görüntüle<iconify-icon icon="lucide:arrow-right" class="text-sm"></iconify-icon></button>' : '');
          return '<article class="rounded-theme border border-border bg-card p-4">' +
            '<div class="flex items-start justify-between gap-2">' +
            '<div class="min-w-0"><p class="text-sm font-bold">' + escapeHtml(o.restoration_type) + '</p>' +
            '<p class="mt-0.5 text-xs text-muted-foreground">Dr. ' + escapeHtml(doc.full_name || '—') + (doc.clinic_name ? ' · ' + escapeHtml(doc.clinic_name) : '') + '</p>' +
            '<p class="mt-0.5 text-xs text-muted-foreground">' + o.unit_count + ' diş' + (o.teeth_numbers ? ' · ' + escapeHtml(o.teeth_numbers) : '') + ' · ' + priceInfo + '</p>' +
            '<p class="mt-0.5 text-[11px] text-muted-foreground">' + d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'}) + '</p></div>' +
            (STATUS_BADGES[o.status] || '') + '</div>' +
            (wfBits.length ? '<div class="mt-2 flex flex-wrap gap-1">' + wfBits.map(function (b) {
              return '<span class="rounded-full bg-muted px-2 py-1 text-[10px] font-semibold text-muted-foreground">' + escapeHtml(b) + '</span>';
            }).join('') + '</div>' : '') +
            (o.note ? '<p class="mt-2 text-xs text-muted-foreground">' + escapeHtml(o.note) + '</p>' : '') +
            actions + '</article>';
        }).join('');
        if (window.zkFlow) window.zkFlow.stagger(el);
      });
    }

    function zkOpenApprove(orderId) {
      approveOrderId = orderId;
      var o = orders.find(function (x) { return x.id === orderId; });
      document.getElementById('ap-summary').textContent = o.restoration_type + ' · ' + o.unit_count + ' diş';
      var sel = document.getElementById('ap-lab');
      sel.innerHTML = '';
      labs.forEach(function (l) {
        var opt = document.createElement('option');
        opt.value = l.id; opt.textContent = l.name;
        sel.appendChild(opt);
      });
      sel.onchange = zkRenderApprovePrice;
      zkRenderApprovePrice();
      document.getElementById('approve-sheet').classList.remove('hidden');
    }

    // Onaydan ONCE gercek tutari gosterir; secilen laboratuvara gore degisir.
    function zkRenderApprovePrice() {
      var o = orders.find(function (x) { return x.id === approveOrderId; });
      var labId = document.getElementById('ap-lab').value || null;
      var el = document.getElementById('ap-price');
      var note = document.getElementById('ap-price-note');
      if (!o) { el.textContent = '—'; note.textContent = ''; return; }
      var pr = zkOrderPrice(o, labId);
      if (!pr) {
        el.textContent = 'Fiyat tanımlı değil';
        note.textContent = 'Bu kalem için fiyat yok; iş faturasız oluşur, sonradan fatura eklenemez.';
        return;
      }
      el.textContent = pr.totalText;
      note.textContent = pr.detay + (pr.isSpecial ? ' · anlaşmalı fiyat' : '') +
        (pr.fiyatsiz ? ' · ' + pr.fiyatsiz + ' kalemin fiyatı tanımlı değil' : '');
    }
    function zkCloseApprove() { document.getElementById('approve-sheet').classList.add('hidden'); }

    function zkApprove() {
      var o = orders.find(function (x) { return x.id === approveOrderId; });
      var labId = document.getElementById('ap-lab').value;
      var errEl = document.getElementById('ap-error');
      errEl.classList.add('hidden');
      if (!o || !labId) {
        errEl.textContent = 'Laboratuvar seçin.';
        errEl.classList.remove('hidden');
        return;
      }
      var btn = document.getElementById('ap-btn');
      btn.disabled = true;
      var client = ZirkonikAuth.client();

      ZirkonikAuth.me().then(function (me) {
        // Kalemler. Doktor birden cok calisma turu girdiyse orders.items dolu
        // gelir; tek turlu eski siparislerde bos olur ve tekil kolonlardan tek
        // kalem uretilir.
        var kalemler = (o.items && o.items.length) ? o.items : [{
          price_item_id: o.price_item_id,
          restoration_type: o.restoration_type,
          teeth: (o.teeth_numbers || '').match(/\d+/g) || [],
          unit_count: o.unit_count,
          color_index: 0
        }];
        var kalemIds = kalemler.map(function (k) { return k.price_item_id; }).filter(Boolean);
        if (o.price_item_id && kalemIds.indexOf(o.price_item_id) < 0) kalemIds.push(o.price_item_id);

        return Promise.all([
          kalemIds.length
            ? client.from('price_list_items').select('id, unit_price, currency, route_room_ids').in('id', kalemIds)
            : Promise.resolve({ data: [] }),
          ZirkonikData.listPriceOverrides(),
          client.from('rooms').select('id').eq('laboratory_id', labId)
        ]).then(function (results) {
          var fiyatKalemleri = results[0].data || [];
          var allOverrides = results[1].data || [];
          var labRoomIds = (results[2].data || []).map(function (r) { return r.id; });
          var kalemById = {};
          fiyatKalemleri.forEach(function (p) { kalemById[p.id] = p; });

          function rotaFor(ids) {
            var f = (ids || []).filter(function (id) { return labRoomIds.indexOf(id) >= 0; });
            return f.length ? f : null;
          }

          // HER kalem KENDI fiyat kaleminden fiyatlaniyor. Onceden siparisin
          // tek price_item_id'si tum tutari belirliyordu ve cok turlu
          // siparislerde veneer, kron fiyatiyla faturalaniyordu.
          // Doktora/lokasyona ozel anlasma varsa o gecerli; anlasma USD de TL
          // de olabilir, para birimi kalemle birlikte damgalaniyor.
          var hazirKalemler = kalemler.map(function (k, i) {
            var pi = kalemById[k.price_item_id];
            var adet = Math.max(1, Number(k.unit_count) || 1);
            var birim = pi ? ZirkonikData.resolveUnitPrice(pi, allOverrides, o.doctor_id, labId) : null;
            return {
              ham: k,
              sira: i,
              price: birim != null ? birim * adet : null,
              currency: pi ? ZirkonikData.resolveUnitCurrency(pi, allOverrides, o.doctor_id, labId) : ZirkonikMoney.DEFAULT,
              unit_count: adet,
              // Her kalem KENDI rotasini kendi fiyat kaleminden almali —
              // hepsine ayni rotayi verirsek veneer, kronun odalarini dolasir.
              route: pi ? rotaFor(pi.route_room_ids) : null
            };
          });

          // Tutarlar para birimine gore gruplaniyor; her grup icin AYRI fatura.
          var tutarGruplari = {};
          hazirKalemler.forEach(function (k) {
            if (k.price == null) return;
            var c = ZirkonikMoney.normalize(k.currency);
            tutarGruplari[c] = (tutarGruplari[c] || 0) + k.price;
          });
          var paraBirimleri = Object.keys(tutarGruplari).filter(function (c) { return tutarGruplari[c]; });

          // jobs.price/jobs.currency ESKI toplama alanlari: tek sayi
          // tutuyorlar, farkli para birimleri toplanamaz. Yalnizca isin kendi
          // para birimindeki (ilk kalemin) tutari yaziliyor — karisik
          // siparislerde gercek toplam job_items'ta ve faturalarda.
          var isParaBirimi = ZirkonikMoney.normalize(hazirKalemler[0] && hazirKalemler[0].currency);
          var isTutari = tutarGruplari[isParaBirimi] || null;
          var plannedRoute = (hazirKalemler[0] && hazirKalemler[0].route) ||
            (kalemById[o.price_item_id] ? rotaFor(kalemById[o.price_item_id].route_room_ids) : null);

          return ZirkonikData.nextJobNumber(labId).then(function (jobNumber) {
            var deliveryVal = document.getElementById('ap-delivery').value;
            return ZirkonikData.createJob({
              organization_id: o.organization_id,
              laboratory_id: labId,
              job_number: jobNumber,
              doctor_id: o.doctor_id,
              restoration_type: o.restoration_type,
              price_item_id: o.price_item_id,
              work_form: o.work_form,
              planned_route: plannedRoute,
              // Önceden doktorun NOTU patient_reference'a yazılıyordu: iki
              // ayrı şey aynı kolona giriyordu ve doktor kaynaklı işlerde
              // patient_name hiç dolmuyordu — doktor kendi kovanına bakınca
              // hangi hastası olduğunu göremiyordu. Artık hasta adını ve
              // protokol numarasını doktor kendisi giriyor, not da kendi
              // alanına (clinical_notes) düşüyor.
              patient_name: o.patient_name,
              clinic_protocol_no: o.clinic_protocol_no,
              clinical_notes: o.note,
              teeth_numbers: o.teeth_numbers,
              unit_count: o.unit_count,
              requested_delivery_at: deliveryVal ? new Date(deliveryVal).toISOString() : null,
              price: isTutari,
              currency: isParaBirimi,
              created_by: me.id
            }).then(function (jobRes) {
              if (jobRes.error) throw jobRes.error;
              var job = jobRes.data;

              // Uretim panosu artik isleri degil kalemleri listeliyor; kalem
              // olusturulmazsa onaylanan siparis panoda hic gorunmezdi.
              var itemsPromise = client.from('job_items').insert(hazirKalemler.map(function (k) {
                return {
                  job_id: job.id,
                  organization_id: job.organization_id,
                  price_item_id: k.ham.price_item_id || null,
                  restoration_type: k.ham.restoration_type || o.restoration_type,
                  teeth: (k.ham.teeth || []).map(Number),
                  unit_count: k.unit_count,
                  price: k.price,
                  currency: k.currency,
                  // Kalemin KENDI calisma formu (VITA rengi vb.). Eski tek
                  // kalemli siparislerde items[] icinde form yok; o zaman
                  // siparisin formu kullaniliyor.
                  work_form: k.ham.work_form || o.work_form || null,
                  planned_route: k.route || plannedRoute,
                  color_index: k.ham.color_index || k.sira,
                  sort_order: k.sira
                };
              })).then(function (ir) {
                if (ir && ir.error) zkToast('İş oluşturuldu ama kalemler eklenemedi: ' + ir.error.message);
              });

              var invoicePromise = itemsPromise.then(function () {
                if (!paraBirimleri.length) return;
                return client.from('doctors').select('payment_terms_days').eq('id', o.doctor_id).single().then(function (docRes) {
                  var days = (docRes.data && docRes.data.payment_terms_days) || 30;
                  var due = new Date(); due.setDate(due.getDate() + days);
                  // Para birimi basina AYRI fatura: bir faturanin tutari tek
                  // sayidir ve odemeler fatura para birimiyle eslesmek
                  // zorunda (trg_guard_payment_currency).
                  return client.from('invoices').insert(paraBirimleri.map(function (c) {
                    return {
                      organization_id: o.organization_id, doctor_id: o.doctor_id, job_id: job.id,
                      amount: tutarGruplari[c], currency: c,
                      due_date: due.toISOString().slice(0, 10), status: 'unpaid'
                    };
                  }));
                }).then(function (invRes) {
                  if (invRes.error) zkToast('İş oluşturuldu ama fatura eklenemedi: ' + invRes.error.message);
                });
              });

              return invoicePromise.then(function () {
                return ZirkonikData.reviewOrder(o.id, {
                  status: 'approved', job_id: job.id,
                  reviewed_by: me.id, reviewed_at: new Date().toISOString()
                });
              });
            });
          });
        });
      }).then(function (res) {
        btn.disabled = false;
        if (res && res.error) throw res.error;
        zkCloseApprove();
        zkToast('Sipariş onaylandı, iş oluşturuldu.');
        loadOrders();
      }).catch(function (err) {
        btn.disabled = false;
        errEl.textContent = 'Onaylanamadı: ' + err.message;
        errEl.classList.remove('hidden');
      });
    }

    function zkReject(orderId) {
      if (!confirm('Bu siparişi reddetmek istediğinize emin misiniz?')) return;
      ZirkonikAuth.me().then(function (me) {
        return ZirkonikData.reviewOrder(orderId, {
          status: 'rejected', reviewed_by: me.id, reviewed_at: new Date().toISOString()
        });
      }).then(function (res) {
        if (res.error) { zkToast('Reddedilemedi: ' + res.error.message); return; }
        zkToast('Sipariş reddedildi.');
        loadOrders();
      });
    }
  
    /* Yumusak tazeleme: sayfa verisi yalniz acilista cekiliyordu, baskasi
     * bir sey degistirince ekranda hic gorunmuyordu. Asagiya cek (zk-ptr.js)
     * ve sekmeye geri donus (zk-yenile.js) bunu cagirir; sayfa yeniden
     * yuklenmez, yalniz veri tazelenir. */
    window.zkRefresh = function () {
      return Promise.all([Promise.resolve(loadOrders())]);
    };
  </script>

</body>
