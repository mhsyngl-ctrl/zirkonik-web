<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://code.iconify.design; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cuujupeindodpsdjcivm.supabase.co wss://cuujupeindodpsdjcivm.supabase.co https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Giriş — Zirkonik</title>

  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/ipad.css">
  <link rel="stylesheet" href="css/zk-utils.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0E1013">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">

  <style>
  :root {
    --color-background: #0E1013;
    --color-foreground: #F2F4F7;
    --color-primary: #3D7CDC;
    --color-primary-foreground: #FFFFFF;
    --color-secondary: #232732;
    --color-secondary-foreground: #C6CBD6;
    --color-accent: #F0A03C;
    --color-accent-foreground: #FFFFFF;
    --color-muted: #1B1E24;
    --color-muted-foreground: #98A0AD;
    --color-card: #15171C;
    --color-card-foreground: #F2F4F7;
    --color-border: #262A32;
    --color-input: #1B1E24;
    --color-destructive: #EF5350;
    --color-destructive-foreground: #FFFFFF;
    --color-success: #10B981;
    --color-success-foreground: #FFFFFF;
    --font-heading: 'Plus Jakarta Sans', sans-serif;
    --font-body: 'Inter', sans-serif;
    --radius: 12px;
  }
  html { overflow-x: hidden; }
  body { font-family: var(--font-body); -webkit-font-smoothing: antialiased; margin: 0; padding: 0; overflow-x: hidden; overscroll-behavior-x: none; }
  </style>
</head>
<body data-page="giris" class="bg-background text-foreground m-0 p-0">
  <div class="h-screen w-screen overflow-y-auto">
    <div class="min-h-screen w-full bg-background text-foreground font-body">
      <header class="px-5 pt-16 pb-6 text-center" style="padding-top:max(4rem,calc(env(safe-area-inset-top) + 12px));">
        <img src="brand/logo.png" alt="Zirkonik" style="height:64px;width:auto;display:block;margin:0 auto">
        <p class="mt-3 text-xs text-muted-foreground">Diş laboratuvarı yönetim paneli</p>
      </header>

      <main class="px-5">
        <div class="mx-auto max-w-sm">
          <div class="flex items-center gap-1 rounded-theme border border-border bg-card p-1">
            <button id="tab-signin" onclick="zkSwitchTab('signin')" class="flex-1 rounded-lg bg-secondary px-2 py-2.5 text-xs font-bold text-secondary-foreground">Giriş Yap</button>
            <button id="tab-signup" onclick="zkSwitchTab('signup')" class="flex-1 rounded-lg px-2 py-2.5 text-xs font-semibold text-muted-foreground">Laboratuvar Kaydı</button>
          </div>

          <form id="form-signin" class="mt-5 space-y-3">
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold text-card-foreground">E-posta</span>
              <input id="si-email" type="email" required class="h-12 w-full rounded-theme border border-border bg-input px-3.5 text-sm" placeholder="ornek@laboratuvar.com">
            </label>
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold text-card-foreground">Şifre</span>
              <div class="relative">
                <input id="si-password" type="password" required class="h-12 w-full rounded-theme border border-border bg-input pl-3.5 pr-20 text-sm" placeholder="••••••••">
                <button type="button" id="si-password-toggle" onclick="zkTogglePassword('si-password', this)" class="absolute right-1 top-1 flex h-10 items-center rounded-lg px-3 text-xs font-bold text-primary">Göster</button>
              </div>
            </label>
            <label class="flex items-center gap-2.5 py-1">
              <input id="si-remember" type="checkbox" checked class="h-5 w-5 rounded border-border accent-primary" style="accent-color:#123B4A;">
              <span class="text-xs font-semibold text-card-foreground">Beni hatırla</span>
            </label>
            <p id="si-error" class="hidden text-xs font-semibold text-destructive"></p>
            <button type="submit" class="flex h-12 w-full items-center justify-center gap-2 rounded-theme bg-primary font-heading text-sm font-bold text-primary-foreground">
              Giriş Yap
            </button>
            <button type="button" onclick="zkOpenForgot()" class="block w-full text-center text-xs font-semibold text-primary">Şifremi unuttum</button>
          </form>

          <form id="form-signup" class="mt-5 hidden space-y-3">
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold text-card-foreground">Laboratuvar adı</span>
              <input id="su-lab" type="text" required class="h-12 w-full rounded-theme border border-border bg-input px-3.5 text-sm" placeholder="Örn. Nişantaşı Laboratuvarı">
              <p class="mt-1.5 text-[11px] leading-4 text-muted-foreground">Laboratuvarınız bu adla otomatik oluşturulur; şehir, adres ve odaları girişten sonra ekleyebilirsiniz.</p>
            </label>
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold text-card-foreground">Ad Soyad</span>
              <input id="su-name" type="text" required class="h-12 w-full rounded-theme border border-border bg-input px-3.5 text-sm" placeholder="Adınız Soyadınız">
            </label>
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold text-card-foreground">E-posta</span>
              <input id="su-email" type="email" required class="h-12 w-full rounded-theme border border-border bg-input px-3.5 text-sm" placeholder="ornek@laboratuvar.com">
            </label>
            <label class="block">
              <span class="mb-1.5 block text-xs font-bold text-card-foreground">Şifre</span>
              <div class="relative">
                <input id="su-password" type="password" required minlength="8" class="h-12 w-full rounded-theme border border-border bg-input pl-3.5 pr-20 text-sm" placeholder="En az 8 karakter">
                <button type="button" id="su-password-toggle" onclick="zkTogglePassword('su-password', this)" class="absolute right-1 top-1 flex h-10 items-center rounded-lg px-3 text-xs font-bold text-primary">Göster</button>
              </div>
              <div class="mt-1.5 flex items-start justify-between gap-3">
                <p class="text-[11px] leading-4 text-muted-foreground">En az 8 karakter; büyük-küçük harf ve rakam içersin. 123456, sifre123 gibi yaygın şifreler güvenlik nedeniyle reddedilir.</p>
                <button type="button" onclick="zkSuggestPassword()" class="shrink-0 text-[11px] font-bold text-primary">Şifre öner</button>
              </div>
            </label>
            <p id="su-error" class="hidden text-xs font-semibold text-destructive"></p>
            <p id="su-success" class="hidden text-xs font-semibold text-success"></p>
            <button type="submit" class="flex h-12 w-full items-center justify-center gap-2 rounded-theme bg-primary font-heading text-sm font-bold text-primary-foreground">
              Laboratuvarımı Oluştur
            </button>
            <p class="text-center text-[11px] leading-4 text-muted-foreground">Kayıt olan ilk kullanıcı yönetici olur ve tam yetkiye sahiptir.</p>
          </form>
        </div>
      </main>
    </div>
  </div>

  <div id="forgot-sheet" class="fixed inset-0 z-40 hidden">
    <div class="absolute inset-0 bg-black/40" onclick="zkCloseForgot()"></div>
    <div class="absolute bottom-0 left-0 w-full rounded-t-theme bg-card p-5 pb-8">
      <p class="font-heading text-lg font-bold">Şifremi unuttum</p>
      <p class="mt-1 text-xs text-muted-foreground">E-posta adresine bir sıfırlama bağlantısı göndereceğiz.</p>
      <div class="mt-4">
        <input id="fp-email" type="email" placeholder="ornek@laboratuvar.com" class="h-12 w-full rounded-theme border border-border bg-input px-3.5 text-sm">
      </div>
      <p id="fp-error" class="mt-2 hidden text-xs font-semibold text-destructive"></p>
      <p id="fp-success" class="mt-2 hidden text-xs font-semibold text-success"></p>
      <button id="fp-submit" onclick="zkSubmitForgot()" class="mt-4 flex h-12 w-full items-center justify-center rounded-theme bg-primary text-sm font-bold text-primary-foreground">Bağlantı gönder</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    /** Şifre alanını okunur hale getirir — kullanıcılar yazdıkları şifreyi
     *  göremediği için kayıt sırasında yanlış yazıp takılıyordu. */
    function zkTogglePassword(inputId, btn) {
      var input = document.getElementById(inputId);
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Gizle' : 'Göster';
    }

    function zkSwitchTab(tab) {
      var isSignin = tab === 'signin';
      document.getElementById('form-signin').classList.toggle('hidden', !isSignin);
      document.getElementById('form-signup').classList.toggle('hidden', isSignin);
      document.getElementById('tab-signin').className = 'flex-1 rounded-lg px-2 py-2.5 text-xs font-bold ' + (isSignin ? 'bg-secondary text-secondary-foreground' : 'text-muted-foreground font-semibold');
      document.getElementById('tab-signup').className = 'flex-1 rounded-lg px-2 py-2.5 text-xs font-bold ' + (!isSignin ? 'bg-secondary text-secondary-foreground' : 'text-muted-foreground font-semibold');
    }

    document.getElementById('form-signin').addEventListener('submit', function (e) {
      e.preventDefault();
      var errEl = document.getElementById('si-error');
      errEl.classList.add('hidden');
      ZirkonikAuth.setRemember(document.getElementById('si-remember').checked);
      ZirkonikAuth.signIn(
        document.getElementById('si-email').value.trim(),
        document.getElementById('si-password').value
      ).then(function (res) {
        if (res.error) {
          errEl.textContent = 'Giriş başarısız: ' + ZirkonikAuth.errorText(res.error);
          errEl.classList.remove('hidden');
          return;
        }
        zkRouteByRole();
      });
    });

    // Doktor hesapları sipariş paneline, lab ekibi üretim paneline gider.
    // Yetki anlık görüntüsü girişte kaydedilir ki ilk sayfada menü doğru
    // halde açılsın (bkz. js/zk-guard.js).
    function zkRouteByRole() {
      ZirkonikAuth.me().then(function (me) {
        try {
          var p = (me && me.user_permissions && me.user_permissions[0]) || {};
          localStorage.setItem('zk-guard', JSON.stringify({
            role: me ? me.role : null,
            can_manage_stock: !!p.can_manage_stock,
            can_view_finance: !!p.can_view_finance,
            can_view_doctors: !!p.can_view_doctors
          }));
        } catch (e) {}
        window.location.href = (me && me.role === 'doktor') ? 'doktor-siparis.html' : 'retim.html';
      }).catch(function () { window.location.href = 'retim.html'; });
    }

    // Sunucu tarafında Supabase, sızıntı listelerindeki şifreleri reddediyor
    // (leaked password protection). Kullanıcı takılmasın diye burada hem
    // güçlü şifre önerisi hem de en yaygın şifreler için erken uyarı var.
    var ZK_COMMON_PASSWORDS = [
      '123456', '1234567', '12345678', '123456789', '1234567890', '12345',
      'password', 'password1', 'passw0rd', 'qwerty', 'qwerty123', 'qwe123',
      'abc123', 'iloveyou', 'admin', 'admin123', 'welcome', 'letmein',
      'sifre', 'sifre123', 'parola', 'parola123', 'merhaba', 'galatasaray',
      'fenerbahce', 'besiktas', 'trabzonspor', 'turkiye', 'istanbul',
      'zirkonik', 'zirkonik123', 'laboratuvar', 'dishekimi', '111111', '000000'
    ];

    function zkSuggestPassword() {
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
      var out = '';
      var arr = new Uint32Array(12);
      crypto.getRandomValues(arr);
      for (var i = 0; i < 12; i++) out += chars[arr[i] % chars.length];
      out += '!';
      var input = document.getElementById('su-password');
      input.type = 'text';
      input.value = out;
      document.getElementById('su-password-toggle').textContent = 'Gizle';
      var okEl = document.getElementById('su-success');
      okEl.textContent = 'Önerilen şifre: ' + out + ' — kaydetmeden önce not alın.';
      okEl.classList.remove('hidden');
      document.getElementById('su-error').classList.add('hidden');
    }

    function zkWeakPasswordWarning(pw) {
      var lower = pw.toLowerCase();
      if (pw.length < 8) return 'Şifre en az 8 karakter olmalı.';
      if (ZK_COMMON_PASSWORDS.indexOf(lower) !== -1) {
        return 'Bu şifre çok yaygın kullanıldığı için kabul edilmiyor. "Şifre öner" düğmesiyle güçlü bir şifre oluşturabilirsiniz.';
      }
      if (/^[0-9]+$/.test(pw)) return 'Yalnızca rakamdan oluşan şifreler kabul edilmiyor. Harf ve sembol de ekleyin.';
      return null;
    }

    document.getElementById('form-signup').addEventListener('submit', function (e) {
      e.preventDefault();
      var errEl = document.getElementById('su-error');
      var okEl = document.getElementById('su-success');
      errEl.classList.add('hidden');
      okEl.classList.add('hidden');

      var pw = document.getElementById('su-password').value;
      var weak = zkWeakPasswordWarning(pw);
      if (weak) {
        errEl.textContent = 'Kayıt başarısız: ' + weak;
        errEl.classList.remove('hidden');
        return;
      }

      ZirkonikAuth.setRemember(true);
      ZirkonikAuth.signUp(
        document.getElementById('su-email').value.trim(),
        pw,
        {
          lab_name: document.getElementById('su-lab').value.trim(),
          full_name: document.getElementById('su-name').value.trim()
        }
      ).then(function (res) {
        if (res.error) {
          errEl.textContent = 'Kayıt başarısız: ' + ZirkonikAuth.errorText(res.error);
          errEl.classList.remove('hidden');
          return;
        }
        if (res.data && res.data.session) {
          zkRouteByRole();
          return;
        }
        okEl.textContent = 'Hesap oluşturuldu. E-postanıza gelen onay linkine tıklayıp giriş yapabilirsiniz.';
        okEl.classList.remove('hidden');
      });
    });

    // Zaten girişliyse doğrudan panele yönlendir.
    ZirkonikAuth.getSession().then(function (session) {
      if (session) zkRouteByRole();
    });

    function zkOpenForgot() {
      document.getElementById('fp-error').classList.add('hidden');
      document.getElementById('fp-success').classList.add('hidden');
      document.getElementById('fp-email').value = document.getElementById('si-email').value.trim();
      document.getElementById('forgot-sheet').classList.remove('hidden');
    }
    function zkCloseForgot() { document.getElementById('forgot-sheet').classList.add('hidden'); }

    function zkSubmitForgot() {
      var errEl = document.getElementById('fp-error');
      var okEl = document.getElementById('fp-success');
      errEl.classList.add('hidden');
      okEl.classList.add('hidden');
      var email = document.getElementById('fp-email').value.trim();
      if (!email) { errEl.textContent = 'E-posta adresi gerekli.'; errEl.classList.remove('hidden'); return; }

      var btn = document.getElementById('fp-submit');
      btn.disabled = true;
      ZirkonikAuth.resetPasswordForEmail(email).then(function (res) {
        btn.disabled = false;
        if (res.error) throw res.error;
        okEl.textContent = 'E-postanıza bir sıfırlama bağlantısı gönderdik. Telefonunuzda gelen bağlantıya dokunun.';
        okEl.classList.remove('hidden');
      }).catch(function (err) {
        btn.disabled = false;
        errEl.textContent = 'Gönderilemedi: ' + ZirkonikAuth.errorText(err);
        errEl.classList.remove('hidden');
      });
    }
  </script>

  <script>
    (function() {
      var els = document.querySelectorAll('iconify-icon');
      for (var i = 0; i < els.length; i++) (function(el) {
        var tries = 0;
        (function check() {
          var s = el.status;
          if (s === 'failed') el.setAttribute('icon', 'lucide:circle');
          else if (s !== 'rendered' && tries++ < 40) setTimeout(check, 250);
        })();
      })(els[i]);
    })();
  </script>
</body>
</html>
