<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://code.iconify.design; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cuujupeindodpsdjcivm.supabase.co wss://cuujupeindodpsdjcivm.supabase.co https://api.iconify.design https://api.simplesvg.com https://api.unisvg.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Yeni Şifre — Zirkonik</title>

  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/ipad.css">
  <link rel="stylesheet" href="css/zk-utils.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0E1013">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">

  <style>
  :root {
    --color-background: #0E1013;
    --color-foreground: #F2F4F7;
    --color-primary: #3D7CDC;
    --color-primary-foreground: #FFFFFF;
    --color-secondary: #232732;
    --color-secondary-foreground: #C6CBD6;
    --color-accent: #F0A03C;
    --color-accent-foreground: #FFFFFF;
    --color-muted: #1B1E24;
    --color-muted-foreground: #98A0AD;
    --color-card: #15171C;
    --color-card-foreground: #F2F4F7;
    --color-border: #262A32;
    --color-input: #1B1E24;
    --color-destructive: #EF5350;
    --color-destructive-foreground: #FFFFFF;
    --color-success: #10B981;
    --color-success-foreground: #FFFFFF;
    --font-heading: 'Plus Jakarta Sans', sans-serif;
    --font-body: 'Inter', sans-serif;
    --radius: 12px;
  }
  html { overflow-x: hidden; }
  body { font-family: var(--font-body); -webkit-font-smoothing: antialiased; margin: 0; padding: 0; overflow-x: hidden; overscroll-behavior-x: none; }
  </style>
</head>
<body data-page="sifre-sifirla" class="bg-background text-foreground m-0 p-0">
  <div class="h-screen w-screen overflow-y-auto">
    <div class="min-h-screen w-full bg-background text-foreground font-body">
      <header class="px-5 pt-16 pb-6 text-center" style="padding-top:max(4rem,calc(env(safe-area-inset-top) + 12px));">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-theme bg-primary text-primary-foreground">
          <iconify-icon icon="lucide:lock-keyhole" class="text-2xl"></iconify-icon>
        </div>
        <p class="mt-4 font-heading text-2xl font-extrabold tracking-tight text-primary">Yeni Şifre</p>
        <p class="mt-1 text-xs text-muted-foreground">Hesabınız için yeni bir şifre belirleyin</p>
      </header>

      <main class="px-5">
        <div id="rs-loading" class="mx-auto max-w-sm text-center text-sm text-muted-foreground">Bağlantı doğrulanıyor…</div>

        <form id="rs-form" class="mx-auto mt-2 hidden max-w-sm space-y-3">
          <label class="block">
            <span class="mb-1.5 block text-xs font-bold text-card-foreground">Yeni şifre</span>
            <input id="rs-password" type="password" minlength="6" required class="h-12 w-full rounded-theme border border-border bg-input px-3.5 text-sm" placeholder="En az 6 karakter">
          </label>
          <label class="block">
            <span class="mb-1.5 block text-xs font-bold text-card-foreground">Yeni şifre (tekrar)</span>
            <input id="rs-password2" type="password" minlength="6" required class="h-12 w-full rounded-theme border border-border bg-input px-3.5 text-sm" placeholder="Şifreyi tekrar girin">
          </label>
          <p id="rs-error" class="hidden text-xs font-semibold text-destructive"></p>
          <button type="submit" class="flex h-12 w-full items-center justify-center gap-2 rounded-theme bg-primary font-heading text-sm font-bold text-primary-foreground">
            Şifreyi kaydet
          </button>
        </form>

        <div id="rs-invalid" class="mx-auto mt-2 hidden max-w-sm text-center">
          <p class="text-sm text-destructive">Bağlantı geçersiz ya da süresi dolmuş.</p>
          <button onclick="location.href='giris.html'" class="mt-4 flex h-12 w-full items-center justify-center rounded-theme border border-border bg-card text-sm font-bold text-primary">Giriş ekranına dön</button>
        </div>
      </main>
    </div>
  </div>

  <script>
    (function() {
      var els = document.querySelectorAll('iconify-icon');
      for (var i = 0; i < els.length; i++) (function(el) {
        var tries = 0;
        (function check() {
          var s = el.status;
          if (s === 'failed') el.setAttribute('icon', 'lucide:circle');
          else if (s !== 'rendered' && tries++ < 40) setTimeout(check, 250);
        })();
      })(els[i]);
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var accessToken = params.get('access_token');
    var refreshToken = params.get('refresh_token');
    // Web'de Supabase token'ları sorgu değil fragment (#...) olarak gönderir;
    // iOS'ta ise native deep-link handler sorgu parametresine çevirir.
    if (!accessToken && location.hash) {
      var hashParams = new URLSearchParams(location.hash.substring(1));
      accessToken = hashParams.get('access_token');
      refreshToken = hashParams.get('refresh_token');
    }

    if (!accessToken || !refreshToken) {
      document.getElementById('rs-loading').classList.add('hidden');
      document.getElementById('rs-invalid').classList.remove('hidden');
    } else {
      ZirkonikAuth.setSession(accessToken, refreshToken).then(function (res) {
        document.getElementById('rs-loading').classList.add('hidden');
        if (res.error) {
          document.getElementById('rs-invalid').classList.remove('hidden');
          return;
        }
        document.getElementById('rs-form').classList.remove('hidden');
      });
    }

    document.getElementById('rs-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var errEl = document.getElementById('rs-error');
      errEl.classList.add('hidden');
      var p1 = document.getElementById('rs-password').value;
      var p2 = document.getElementById('rs-password2').value;
      if (p1.length < 6) { errEl.textContent = 'Şifre en az 6 karakter olmalı.'; errEl.classList.remove('hidden'); return; }
      if (p1 !== p2) { errEl.textContent = 'Şifreler eşleşmiyor.'; errEl.classList.remove('hidden'); return; }

      ZirkonikAuth.updateMyPassword(p1).then(function (res) {
        if (res.error) throw res.error;
        window.location.href = 'retim.html';
      }).catch(function (err) {
        errEl.textContent = 'Kaydedilemedi: ' + err.message;
        errEl.classList.remove('hidden');
      });
    });
  </script>

</body>
</html>
